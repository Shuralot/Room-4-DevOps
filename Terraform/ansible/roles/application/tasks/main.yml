---
- name: Garantir diretório da aplicação
  ansible.builtin.file:
    path: /opt/cloud-lab-02
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Baixar imagem da aplicação
  community.docker.docker_image:
    name: "{{ app_image }}"
    tag: "{{ app_version }}"
    source: pull

- name: Criar e iniciar container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ app_image }}:{{ app_version }}"
    state: started
    restart_policy: unless-stopped
    recreate: false
    env: "{{ app_environment }}"
    published_ports:
      - "{{ app_port }}:{{ container_port }}"

- name: Aguardar aplicação responder
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}{{ app_health_path }}"
    method: GET
    status_code: 200
  register: app_health
  retries: 12
  delay: 5
  until: app_health.status == 200
