# Pipeline de switch blue/green: o cutover do tráfego de produção e mecanismo de rollback.
#
# Referência: docs/cd-pipeline.md

name: CD Blue/Green switch

run-name: 'Blue/Green switch → tráfego para ${{ inputs.color }}'

on:
  workflow_dispatch:
    inputs:
      color:
        description: 'Cor que deve receber o tráfego de produção'
        required: true
        type: choice
        options:
          - blue
          - green
        default: blue

permissions:
  contents: read

env:
  NAMESPACE: todolist-bg

jobs:
  switch:
    name: Vira o tráfego de produção
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Confirma saúde do slot e vira o tráfego
        env:
          KIND_CLUSTER: ${{ vars.KIND_CLUSTER || 'devops-labs' }}
          COLOR: ${{ inputs.color }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EC2_USER || 'ec2-user' }}@${{ secrets.EC2_HOST }}" \
            "KIND_CLUSTER='${KIND_CLUSTER}' NS='${NAMESPACE}' COLOR='${COLOR}' bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -f ~/.kube/config ] && sudo test -f /root/.kube/config; then
            mkdir -p ~/.kube
            sudo cp /root/.kube/config ~/.kube/config
            sudo chown -R ec2-user:ec2-user ~/.kube
            chmod 600 ~/.kube/config
          fi

          kubectl config use-context "kind-${KIND_CLUSTER}"

          # 1. Confirmar que o slot alvo está saudável antes de virar
          echo "Validando saúde do slot ${COLOR} antes do switch..."
          HEALTHY=false
          for i in $(seq 1 15); do
            if curl -fsS -H "Host: ${COLOR}.todolist-bg.local" http://localhost/healthz >/dev/null 2>&1; then
              HEALTHY=true
              echo "Slot ${COLOR} saudável!"
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Abortando switch: Slot ${COLOR} não está saudável em http://${COLOR}.todolist-bg.local/healthz"
            exit 1
          fi

          # 2. Guardar a cor atual para instrução de rollback
          PREV=$(kubectl get svc todolist -n "${NS}" -o jsonpath='{.spec.selector.color}' 2>/dev/null || echo "desconhecida")
          echo "Cor ativa atual em produção: ${PREV}"

          # 3. O switch em si: patch atômico no selector do Service todolist
          echo "Virando tráfego de produção para a cor ${COLOR}..."
          kubectl patch svc todolist -n "${NS}" \
            -p "{\"spec\":{\"selector\":{\"app\":\"todolist\",\"color\":\"${COLOR}\"}}}"

          # 4. Confirmar produção respondendo no host de produção
          echo "Validando tráfego de produção em http://todolist-bg.local/healthz..."
          PROD_OK=false
          for i in $(seq 1 15); do
            if curl -fsS -H "Host: todolist-bg.local" http://localhost/healthz >/dev/null 2>&1; then
              PROD_OK=true
              echo "Produção respondendo com sucesso na cor ${COLOR}!"
              break
            fi
            sleep 2
          done

          if [ "$PROD_OK" != "true" ]; then
            echo "::error::Produção falhou após o switch!"
            exit 1
          fi

          # 5. Instrução de rollback
          echo "========================================================="
          echo "✅ SWITCH CONCLUÍDO COM SUCESSO!"
          echo "Tráfego de produção virado de '${PREV}' para '${COLOR}'."
          echo ""
          echo "🔄 INSTRUÇÃO DE ROLLBACK EM CASO DE INCIDENTE:"
          echo "Dispare este mesmo workflow ('CD Blue/Green switch') com:"
          echo "  color = ${PREV}"
          echo "O tráfego retornará instantaneamente para a versão anterior."
          echo "========================================================="
EOF
