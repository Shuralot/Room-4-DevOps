# Pipeline de deploy blue/green: publica a versão num slot de cor.
#
# Referência: docs/cd-pipeline.md

name: CD Blue/Green deploy

# run-name dinâmico: a aba Actions mostra a cor e a tag de cada execução.
run-name: 'Blue/Green deploy → ${{ inputs.color }} (${{ inputs.image_tag }})'

on:
  workflow_dispatch:
    inputs:
      color:
        description: 'Slot de cor onde publicar a versão'
        required: true
        type: choice
        options:
          - blue
          - green
        default: blue
      image_tag:
        description: 'Tag da imagem a publicar (Docker Hub)'
        required: true
        default: latest

permissions:
  contents: read

env:
  IMAGE_NAME: app-k8s-todolist
  NAMESPACE: todolist-bg

jobs:
  deploy:
    name: Deploy no slot de cor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy bootstrap manifest to EC2
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            k8s/blue-green/bootstrap.yaml \
            "${{ secrets.EC2_USER || 'ec2-user' }}@${{ secrets.EC2_HOST }}:~/blue-green-bootstrap.yaml"

      - name: Deploy no slot e smoke test
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          KIND_CLUSTER: ${{ vars.KIND_CLUSTER || 'devops-labs' }}
          COLOR: ${{ inputs.color }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EC2_USER || 'ec2-user' }}@${{ secrets.EC2_HOST }}" \
            "IMAGE='${IMAGE}' KIND_CLUSTER='${KIND_CLUSTER}' NS='${NAMESPACE}' COLOR='${COLOR}' bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -f ~/.kube/config ] && sudo test -f /root/.kube/config; then
            mkdir -p ~/.kube
            sudo cp /root/.kube/config ~/.kube/config
            sudo chown -R ec2-user:ec2-user ~/.kube
            chmod 600 ~/.kube/config
          fi

          kubectl config use-context "kind-${KIND_CLUSTER}"

          # Bootstrap idempotente — na primeira execução cria o namespace e recursos
          if ! kubectl get ns "${NS}" >/dev/null 2>&1; then
            echo "Namespace ${NS} não existe. Aplicando bootstrap..."
            kubectl apply -f ~/blue-green-bootstrap.yaml
          fi

          # Avisar se a cor escolhida já é a de produção
          ACTIVE=$(kubectl get svc todolist -n "${NS}" -o jsonpath='{.spec.selector.color}' 2>/dev/null || echo "none")
          if [ "${ACTIVE}" = "${COLOR}" ]; then
            echo "::warning::Atenção: A cor '${COLOR}' já é a cor ativa em produção! O deploy afetará o tráfego atual diretamente."
          else
            echo "Slot '${COLOR}' está inativo em produção (ativo: ${ACTIVE}). Deploy isolado seguro."
          fi

          # Publicar a imagem no Deployment da cor e aguardar rollout
          echo "Atualizando imagem de todolist-${COLOR} para ${IMAGE}..."
          kubectl set image "deployment/todolist-${COLOR}" todolist="${IMAGE}" -n "${NS}"
          kubectl rollout status "deployment/todolist-${COLOR}" -n "${NS}" --timeout=120s

          # Smoke test no host fixo do slot
          echo "Executando smoke test no slot fixo: http://localhost/healthz com Host: ${COLOR}.todolist-bg.local..."
          for i in $(seq 1 20); do
            if curl -fsS -H "Host: ${COLOR}.todolist-bg.local" http://localhost/healthz; then
              echo "Smoke test no slot ${COLOR} passou com sucesso!"
              exit 0
            fi
            sleep 3
          done
          echo "Falha no smoke test do slot ${COLOR}"
          exit 1
EOF
